media:
  input: site/media
  output: /media
  categories: [image]
content:
  - name: portfolio
    label: 내 포트폴리오
    type: file
    path: portfolio.json
    format: json
    fields:
      - name: profile
        label: 프로필
        type: object
        fields:
          - { name: name, label: 이름, type: string, required: true }
          - { name: handle, label: 영문 활동명, type: string }
          - { name: intro, label: 소개, type: text }
          - { name: image, label: 프로필 사진, type: image }
          - { name: github, label: GitHub 프로필 (https), type: string }
      - name: projects
        label: 프로젝트 및 상세 페이지
        type: object
        list: true
        fields:
          - { name: title, label: 프로젝트명, type: string, required: true }
          - name: slug
            label: 상세 페이지 주소 이름
            description: '예: lens-notes → /projects/lens-notes/. 다른 프로젝트와 중복되지 않게 입력하세요. 발행 후 바꾸면 기존 주소가 바뀝니다.'
            type: string
            required: true
            pattern: { regex: '^[a-z0-9]+(-[a-z0-9]+)*$', message: 영문 소문자·숫자와 단어 사이의 하이픈만 사용할 수 있습니다. }
          - { name: category, label: 프로젝트 분류, type: string }
          - { name: summary, label: 한 줄 소개, type: text }
          - { name: image, label: 대표 이미지, type: image }
          - { name: url, label: 프로젝트 링크 (https), type: string }
          - { name: source, label: 소스 링크 (https), type: string }
          - name: sections
            label: 상세 본문 단락
            type: object
            list: true
            fields:
              - { name: title, label: 소제목, type: string, required: true }
              - { name: text, label: 내용, type: text }
              - { name: image, label: 본문 이미지, type: image }
              - { name: caption, label: 이미지 설명, type: string }
      - name: skills
        label: 스킬 · 많이 해봤어요
        type: string
        list: true
      - name: otherSkills
        label: 스킬 · 해본 적 있어요
        type: string
        list: true
      - name: experience
        label: 이력
        type: object
        list: true
        fields:
          - { name: title, label: 활동 또는 직무, type: string, required: true }
          - { name: period, label: 기간, type: string }
          - { name: text, label: 설명, type: text }
          - { name: url, label: 관련 링크 (https), type: string }
      - name: photos
        label: 사진첩
        type: object
        list: true
        fields:
          - { name: caption, label: 사진 설명, type: string, required: true }
          - { name: image, label: 사진, type: image, required: true }
      - name: archive
        label: 예전 프로필 기록
        type: object
        list: true
        fields:
          - { name: title, label: 제목, type: string, required: true }
          - { name: text, label: 원문, type: text }
