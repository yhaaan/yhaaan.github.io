name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test static rendering
        run: python -m unittest test_portfolio
      - name: Build public pages
        run: python build_portfolio.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/portfolio
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
